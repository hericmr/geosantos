name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

# Configuração de permissões para o workflow
permissions:
  contents: read
  pages: write
  id-token: write

# Configuração para permitir que o workflow seja executado por pull requests
concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  GODOT_VERSION: '4.7.2'

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_KEY }}

      # Versión Godot del juego, publicada en /geosantos/jogo/ mientras se desarrolla
      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/bin/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-web

      - name: Install Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.local/bin
          curl -sL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" ~/.local/bin/godot
          rm godot.zip
          python3 scripts/fetch_godot_web_templates.py "$GODOT_VERSION"

      - name: Export Godot (Web)
        run: |
          mkdir -p dist/jogo
          ~/.local/bin/godot --headless --path godot --import
          ~/.local/bin/godot --headless --path godot --export-release "Web" "$GITHUB_WORKSPACE/dist/jogo/index.html"
          test -f dist/jogo/index.wasm

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4 